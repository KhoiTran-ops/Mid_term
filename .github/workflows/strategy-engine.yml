name: Supplied strategy engine
on: [push, pull_request, workflow_dispatch]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run original supplied tests
        run: python test_engine.py
      - name: Verify recorded configuration hash
        run: python -c "import json,pathlib,strategy_engine; assert strategy_engine.config_hash(json.loads(pathlib.Path('strategy_config.json').read_text(encoding='utf-8'))) == pathlib.Path('strategy_config.sha256').read_text().strip()"
      - name: Run strategy integration regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_strategy_adapter.py
